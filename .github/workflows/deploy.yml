name: Publish VIZERA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download missing Unsplash photos into public/images
        run: node scripts/download-unsplash-images.mjs
      - name: Commit local image files
        run: |
          git add public/images/hero-etretat.jpg public/images/hero-etretat-muted.jpg public/images/destinations/*.jpg
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "assets: store Unsplash photos locally [skip ci]"
            git push origin HEAD:main
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build static website
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_BASE_PATH: /litvinavisas
          NEXT_PUBLIC_CONTACT_FORM_ENDPOINT: ${{ vars.NEXT_PUBLIC_CONTACT_FORM_ENDPOINT }}
          NEXT_PUBLIC_REVIEWS_TG_URL: ${{ vars.NEXT_PUBLIC_REVIEWS_TG_URL }}
        run: npm run build
      - name: Keep GitHub Pages static assets intact
        run: touch out/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
